<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Stream Deck Toolkit — two Python command-line tools that render, verify and package Elgato Stream Deck icon packs and plugins">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#141a35"/>
      <stop offset="1" stop-color="#1c1030"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8fe"/>
      <stop offset="0.5" stop-color="#a06bff"/>
      <stop offset="1" stop-color="#ff6ac1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- motif: says what the repo is -->
  <g transform="translate(70,100)">
    <rect x="0" y="6" width="190" height="140" rx="12" fill="#0e1430" stroke="url(#accent)" stroke-width="2.5"/>
    <line x1="0" y1="36" x2="190" y2="36" stroke="#2a3358" stroke-width="2"/>
    <g fill="#2a3358"><circle cx="18" cy="21" r="5"/><circle cx="36" cy="21" r="5"/><circle cx="54" cy="21" r="5"/></g>
    <path d="M 20 60 l 16 13 l -16 13" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#aab4d8"><rect x="46" y="68" width="86" height="8" rx="4"/></g>
    <g fill="#5a678f"><rect x="20" y="96" width="120" height="7" rx="3.5"/><rect x="20" y="115" width="78" height="7" rx="3.5"/></g>
    <rect x="106" y="112" width="15" height="13" rx="2" fill="url(#accent)" filter="url(#glow)"/>
  </g>

  <!-- title block -->
  <g transform="translate(300,0)">
    <text x="0" y="170" font-family="-apple-system, Segoe UI, sans-serif" font-size="68" font-weight="700" fill="#ffffff" letter-spacing="1.5">STREAM DECK TOOLKIT</text>
    <rect x="2" y="192" width="878" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="2" y="238" font-family="-apple-system, Segoe UI, sans-serif" font-size="24" fill="#aab4d8">Two Python CLIs that render, verify and package icon packs and plugins.</text>
    <text x="2" y="276" font-family="Menlo, Consolas, monospace" font-size="17" fill="#7f8bb5">sdicons  ·  sdplugin  ·  Maker Console rules  ·  Pillow + rsvg-convert</text>
  </g>

  <!-- family baseline -->
  <rect x="70" y="312" width="1140" height="3" rx="1.5" fill="#222b4d"/>
  <rect x="70" y="312" width="210" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
